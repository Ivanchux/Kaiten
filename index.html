<script>

const D={meal:{n:0,start:0,by:{}},best:0,total:0,hist:[],tt:{},gh:0,theme:"auto",bg:"sushi",ac:"",type:"maki",face:"kawaii",acc:"none",fx:"flip",snd:"pop",vib:true,goal:10,price:1.5};
let S=Object.assign({},D),view=0,armed=0;
try{const r=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLDKEY));if(r){S=sane(r);if(!localStorage.getItem(KEY)){localStorage.setItem(KEY,JSON.stringify(S));if(localStorage.getItem(KEY))localStorage.removeItem(OLDKEY)}}}catch(e){}

/* ---------- tema ---------- */
function theme(){const p=S.bg=="dojo"?P.dojo:S.bg=="dojon"?P.dojon:P[S.theme],r=document.documentElement,ks=["bg","fg","card","line","muted","ac"];r.dataset.bg=S.bg=="dojon"?"dojo":(S.bg||"sushi");r.dataset.dk=(p.dk||(!p.bg&&matchMedia("(prefers-color-scheme:dark)").matches))?"1":"";
  if(!p.bg){r.removeAttribute("data-theme");ks.forEach(k=>r.style.removeProperty("--"+k))}
  else{r.dataset.theme="x";ks.forEach(k=>r.style.setProperty("--"+k,p[k]))}
  if(S.ac)r.style.setProperty("--ac",S.ac);
  document.querySelector('meta[name="theme-color"]').content=p.bg||(matchMedia("(prefers-color-scheme:dark)").matches?"#121212":"#fafaf7")}

/* ---------- dibujo ---------- */
function svg(k,mini,face,acc){k=k||S.type;const t=T[k],n=mini?0:S.meal.n,done=!mini&&n>=S.goal,c=t.c;let fx=75,b,fy,fs=1,fc=t.d?"#2a2a2a":"#fff",top=45;
  const R='fill="#fff" stroke="#d9d9d2" stroke-width="2"';

  else if(t.sh=="tam"){top=48;fy=76;fx=58;fs=.75;b=`<rect x="26" y="78" width="98" height="54" rx="26" ${R}/><rect x="14" y="48" width="122" height="52" rx="16" fill="${c}"/><path d="M26 62h98" stroke="#fff" opacity=".35" stroke-width="3"/><rect x="104" y="44" width="16" height="60" rx="3" fill="#1a1a1a"/>`}
  else if(t.sh=="ebi"){top=48;fy=78;fx=70;fs=.75;fc="#fff";b=`<rect x="26" y="80" width="98" height="52" rx="26" ${R}/><path d="M16 74Q16 48 60 48H104Q132 48 134 76Q134 100 106 100H44Q16 100 16 74Z" fill="${c}"/><path d="M44 52q7 22 0 44M66 50q7 24 0 48M88 50q7 24 0 48M110 54q7 20 0 40" stroke="#e8553f" stroke-width="3" fill="none" opacity=".45"/><path d="M130 62L148 46L147 80L132 78Z" fill="#e8553f"/>`}
  else if(t.sh=="gyo"){top=45;fy=94;fs=.85;fc="#2a2a2a";b=`<path d="M20 105Q20 45 75 45Q130 45 130 105Q130 124 112 124H38Q20 124 20 105Z" fill="${c}" stroke="#d9b877" stroke-width="2"/><path d="M24 108H126Q124 124 108 124H42Q26 124 24 108Z" fill="#c98d3f"/><path d="M44 58q4 6 0 12M58 50q4 6 0 12M75 47q4 6 0 12M92 50q4 6 0 12M106 58q4 6 0 12" stroke="#c98d3f" stroke-width="3" fill="none" stroke-linecap="round"/>`}
  else if(t.sh=="sas"){top=34;fy=88;fs=.7;fc="#fff";b=`<g transform="rotate(-20 75 135)"><rect x="34" y="40" width="40" height="92" rx="20" fill="${c}" opacity=".85"/></g><g transform="rotate(20 75 135)"><rect x="76" y="40" width="40" height="92" rx="20" fill="${c}" opacity=".85"/></g><rect x="48" y="34" width="54" height="98" rx="27" fill="${c}"/><path d="M60 52q15 10 30 0M60 112q15-8 30 0" stroke="#fff" opacity=".4" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="124" cy="126" r="11" fill="#7cb342"/>`}
  else if(t.sh=="ura"){top=30;fy=86;fs=.85;fc="#fff";b=`<circle cx="75" cy="85" r="56" ${R}/><circle cx="75" cy="85" r="47" fill="none" stroke="${c}" stroke-width="6" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="75" cy="85" r="38" fill="#1a1a1a"/>`}
  else if(t.sh=="roll"){b=`<rect x="20" y="45" width="110" height="90" rx="26" fill="#1a1a1a"/><path d="M20 73V71A26 26 0 0 1 46 45H104A26 26 0 0 1 130 71V73Z" fill="${c}"/>`;fy=105}
  else if(t.sh=="ura"){b=`<rect x="20" y="45" width="110" height="90" rx="26" ${R}/><path d="M20 73V71A26 26 0 0 1 46 45H104A26 26 0 0 1 130 71V73Z" fill="${c}"/><g fill="#bdbdb4"><circle cx="38" cy="124" r="2"/><circle cx="62" cy="128" r="2"/><circle cx="92" cy="125" r="2"/><circle cx="114" cy="122" r="2"/></g>`;fy=105;fc="#2a2a2a"}
  else if(t.sh=="nig"){top=50;b=`<rect x="26" y="78" width="98" height="54" rx="26" ${R}/><rect x="14" y="50" width="122" height="50" rx="25" fill="${c}"/><path d="M40 62q35-8 70 0" stroke="#fff" opacity=".4" stroke-width="4" fill="none" stroke-linecap="round"/>`;fy=82;fs=.8}
  else{top=24;b=`<path d="M75 24L128 122Q134 132 120 132H30Q16 132 22 122Z" ${R} stroke-linejoin="round"/><rect x="52" y="104" width="46" height="28" rx="4" fill="#1a1a1a"/>`;fy=86;fs=.85;fc="#2a2a2a"}
  const st={kawaii:`<circle cx="-20" cy="-2" r="5" fill="${fc}"/><circle cx="20" cy="-2" r="5" fill="${fc}"/>`,
    happy:`<path d="M-26 2q6-9 12 0M14 2q6-9 12 0" stroke="${fc}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    sleepy:`<path d="M-26 0h12M14 0h12" stroke="${fc}" stroke-width="4" stroke-linecap="round"/>`,
    cool:`<rect x="-34" y="-9" width="28" height="15" rx="6" fill="#111"/><rect x="6" y="-9" width="28" height="15" rx="6" fill="#111"/><path d="M-6-3h12" stroke="#111" stroke-width="3"/>`}[face||S.face];
  const mo=done?`<path d="M-10 12q10 15 20 0z" fill="${fc}"/>`:`<path d="M-9 10q9 10 18 0" stroke="${fc}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const ch=`<circle cx="-34" cy="12" r="6" fill="#ff5c8a" opacity=".4"/><circle cx="34" cy="12" r="6" fill="#ff5c8a" opacity=".4"/>`;
  const ax=acc||S.acc,ac=(!mini||acc)&&A[ax]?`<text class="acx" x="75" y="${top+8}" font-size="46" text-anchor="middle" transform="rotate(-6 75 ${top})">${A[ax]}</text>`:"";
  return `<svg viewBox="0 0 150 150"><g transform="translate(${75-CEN[t.sh][0]} ${75-CEN[t.sh][1]})">${b}<g transform="translate(${fx} ${fy}) scale(${fs})"><g class="lk"><g class="ey">${st}</g></g><g class="mo">${mo}</g>${ch}</g>${ac}</g></svg>`}

/* ---------- datos ---------- */
const dk=t=>new Date(t).toLocaleDateString("sv");
function stats(){const h=S.hist,m=S.meal,tn=dk(Date.now()),days={};
  h.forEach(x=>days[dk(x.t)]=(days[dk(x.t)]||0)+x.n);if(m.n)days[tn]=(days[tn]||0)+m.n;
  let st=0,d=new Date();if(!days[dk(d)])d.setDate(d.getDate()-1);while(days[dk(d)]){st++;d.setDate(d.getDate()-1)}
  const wk=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);wk.push([x.toLocaleDateString("es-ES",{weekday:"narrow"}).toUpperCase(),days[dk(x)]||0])}
  const meals=h.length,avg=meals?Math.round(h.reduce((a,x)=>a+x.n,0)/meals*10)/10:0;
  return{days,st,wk,meals,avg,fav:Object.entries(S.tt).sort((a,b)=>b[1]-a[1])[0],today:days[tn]||0,spent:(h.reduce((a,x)=>a+(x.cost||0),0)+m.n*S.price).toFixed(2)}}
const AC=[["🥢","Primer bocado","1 pieza",d=>S.total>=1],["🍣","Calentando","25 piezas totales",d=>S.total>=25],["🔥","Cien piezas","100 en total",d=>S.total>=100],["🏯","Medio millar","500 en total",d=>S.total>=500],["👑","Mil piezas","1000 en total",d=>S.total>=1000],["🍱","Gran comilona","20 en una comida",d=>S.best>=20],["🐉","Bestia del sushi","40 en una comida",d=>S.best>=40],["📖","Cliente fiel","10 comidas guardadas",d=>d.meals>=10],["📅","En racha","3 días seguidos",d=>d.st>=3],["🎯","Objetivo cumplido","Cumple tu meta 5 veces",d=>S.gh>=5],["🌈","Paladar completo","Prueba todos los tipos",d=>Object.keys(S.tt).length>=Object.keys(T).length]];
const lvl=()=>{let l=LV[0];LV.forEach(x=>{if(S.total>=x[0])l=x});return l[1]};

/* ---------- sonido ---------- */
let ac;function snd(){if(S.snd=="off")return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime,n=S.meal.n;let f=300,d=.2;o.type="sine";
  if(S.snd=="pop"){f=260+Math.min(n,30)*12;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2,t+.1)}
  else{if(S.snd=="bell"){f=880;o.type="triangle";d=.55}else{f=[523,587,659,784,880][n%5]*(n%10<5?1:2);d=.35}o.frequency.setValueAtTime(f,t)}
  g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
function burst(){const e=["🍣","🍱","🥢","🎉","🍙","🍤"];for(let i=0;i<28;i++){const d=document.createElement("div");d.className="conf";d.textContent=e[i%6];d.style.left=Math.random()*100+"vw";d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}}

/* ---------- acciones ---------- */
function add(){const m=S.meal;if(!m.start)m.start=Date.now();m.n++;m.by[S.type]=(m.by[S.type]||0)+1;S.total++;S.tt[S.type]=(S.tt[S.type]||0)+1;
  const rec=S.best>0&&m.n===S.best+1,g=m.n===S.goal;if(m.n>S.best)S.best=m.n;if(g)S.gh++;
  const r=$("#roll");r.className="roll";void r.offsetWidth;r.className="roll a-"+(S.fx=="rand"?FX[Math.random()*7|0]:S.fx);spark((rec||g)?26:9+Math.min(cb,8)*2);
  const now=Date.now();cb=now-ct<1100?cb+1:1;ct=now;cmb();snd();vib(cb>4?[10,20,10]:15);const p=document.createElement("div");p.className="plus";p.textContent="+1";p.style.left=45+Math.random()*10+"%";$("#stage").appendChild(p);setTimeout(()=>p.remove(),800);
  if(rec||g){burst();vib([30,40,60]);toast(rec?"¡Nuevo récord! 🏆":"¡Meta cumplida! 🎯")}
  save();render(1)}
$("#roll").onclick=()=>{if(sw){sw=0;return}add()};
$("#roll").addEventListener("animationend",e=>{if(e.target.tagName=="svg")$("#roll").className="roll"});
function spark(n){const w=document.querySelector(".ringw"),col=["var(--pc)","#fff","var(--pc)","#ffd23f"],pl=document.createElement("div");pl.className="pl";w.appendChild(pl);setTimeout(()=>pl.remove(),700);
 for(let i=0;i<n;i++){const a=Math.random()*6.283,d=70+Math.random()*60,e=document.createElement("div"),c=col[i%4];e.className="pt";e.style.cssText=`background:${c};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.random()*360}deg;animation-delay:${Math.random()*.06}s`;if(c=="#fff")e.style.border="1.5px solid #d9d9d2";w.appendChild(e);setTimeout(()=>e.remove(),900)}}
$("#bUndo").onclick=()=>{const m=S.meal;if(m.n>0){const k=m.by[S.type]>0?S.type:Object.keys(m.by).find(x=>m.by[x]>0);m.n--;S.total=Math.max(0,S.total-1);if(k){m.by[k]--;S.tt[k]=Math.max(0,(S.tt[k]||0)-1)}if(!m.n)m.start=0;save();render(1);vib(10)}};
function openSheet(h){$("#shp").innerHTML=h;$("#sh").classList.add("on")}
$("#sh").onclick=e=>{if(e.target.id=="sh"||e.target.dataset.close!=null)$("#sh").classList.remove("on")};
$("#bNew").onclick=()=>{const m=S.meal;if(!m.n)return toast("Aún no has comido nada 🍣");
  const mins=Math.max(1,Math.round((Date.now()-m.start)/60000));
  openSheet(`<h2 style="margin:0 0 6px">Terminar comida</h2><p class="lbl" style="margin-bottom:12px;font-size:14px"><b style="color:var(--fg)">${m.n} piezas</b> · ${eur(m.n*S.price)} · ${mins} min</p><input type="text" id="place" placeholder="¿Dónde has comido? (opcional)" maxlength="40"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-close style="flex:1">Seguir</button><button class="btn pri" id="bSave" style="flex:2">Guardar comida</button></div>`);
  $("#bSave").onclick=()=>{S.hist.unshift({n:m.n,t:Date.now(),place:$("#place").value.trim(),dur:mins,by:m.by,cost:+(m.n*S.price).toFixed(2)});S.hist=S.hist.slice(0,500);S.meal={n:0,start:0,by:{}};save();$("#sh").classList.remove("on");render();toast("Comida guardada ✅")}};
$("#bShare").onclick=()=>{const t=`🍣 Llevo ${S.meal.n} piezas hoy (récord: ${S.best}). Nivel: ${lvl()} · Kaiten`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});else try{navigator.clipboard.writeText(t);toast("Copiado 📋")}catch(e){toast(t)}};

/* ---------- vistas ---------- */
function render(bump){const m=S.meal;$("#count").textContent=m.n;if(bump){const c=$("#count");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
  $("#rg").style.strokeDashoffset=578*(1-Math.min(1,m.n/S.goal));
  $("#hs").textContent=S.best;$("#hsl").textContent=S.best?"Tu récord":"Sin récord aún";$("#gl").textContent=Math.min(m.n,S.goal)+" / "+S.goal;$("#lvl").textContent=lvl();$("#pname").textContent=T[S.type].n;document.querySelector(".app").style.setProperty("--pc",{r:"#ff7a2f",n:"#ff5c8a",x:"#e0a82e"}[T[S.type].cat]);document.querySelector(".ringw").style.setProperty("--it",S.meal.n>=S.goal?"1.6s":"3.4s");$("#pb").style.width=Math.min(100,S.meal.n/S.goal*100)+"%";
  if(!bump||!$("#roll").innerHTML||true)$("#roll").querySelector("svg")?.remove(),$("#roll").insertAdjacentHTML("afterbegin",svg());
  const cn=c=>Object.keys(T).filter(k=>T[k].cat==c).reduce((a,k)=>a+(m.by[k]||0),0),cc=T[S.type].cat;
  $("#types").innerHTML=`<div class="cats">${CT.map(c=>`<button class="cat ${cc==c[0]?"on":""}" data-c="${c[0]}">${""}<span class="mi">${Object.keys(T).filter(k=>T[k].cat==c[0]).map(k=>svg(k,1)).join("")}</span><span>${c[2]}</span>${cn(c[0])?`<b>${cn(c[0])}</b>`:""}</button>`).join("")}</div><div class="cards">${Object.keys(T).filter(k=>T[k].cat==cc).map(k=>`<button class="tc ${k==S.type?"on":""}" data-t="${k}" aria-label="${T[k].n}">${m.by[k]?`<u>${m.by[k]}</u>`:""}${svg(k,1)}<span>${T[k].n}</span></button>`).join("")}</div>`;
  tick();if(view==1)vStats();if(view==2)vAch()}
function pick(k){const sc=T[k].cat!=T[S.type].cat;S.type=k;save();if(sc){const t=$("#types");t.classList.add("swap");setTimeout(()=>t.classList.remove("swap"),600)}render();const r=$("#roll");r.className="roll";void r.offsetWidth;r.className="roll a-pop";vib(8);spark(6)}
$("#types").onclick=e=>{const k=e.target.closest("[data-t]")?.dataset.t,c=e.target.closest("[data-c]")?.dataset.c;if(k)pick(k);else if(c)pick(Object.keys(T).find(x=>T[x].cat==c))};
let sx=0,sw=0;$("#stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sw=0},{passive:true});
$("#stage").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){sw=1;const ks=Object.keys(T),i=(ks.indexOf(S.type)+(dx<0?1:-1)+ks.length)%ks.length;pick(ks[i])}},{passive:true});
function tick(){const m=S.meal;if(!m.start){$("#sub").textContent="Toca para sumar · desliza para cambiar";return}
  const s=Math.floor((Date.now()-m.start)/1000),ppm=(m.n/Math.max(1,s/60)).toFixed(1);
  $("#sub").textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")} · ${ppm} piezas/min`}

async function bkDown(){const ph={};try{for(const k of await pKeys())ph[k]=await new Promise(async r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(await pGet(k))})}catch(e){}
  S.bk=Date.now();save();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"kaiten",v:VER,data:S,photos:ph})],{type:"application/json"}));a.download="kaiten-copia-"+new Date().toISOString().slice(0,10)+".json";a.click();toast("Copia descargada");if(view==3)vSet()}
async function bkUp(file){try{const j=JSON.parse(await file.text()),ns=sane(j.data||j);for(const [k,v] of Object.entries(j.photos||{}))if(/^[a-z0-9]{1,16}$/.test(k)&&typeof v=="string"&&v.startsWith("data:image/"))await pPut(k,await (await fetch(v)).blob());S=ns;save();render();toast("Copia importada");if(view==3)vSet()}catch(e){toast("Archivo no válido")}}
{const o=vSet;vSet=function(){o();$("#v3").insertAdjacentHTML("beforeend",`<div class="bkx"><h3>Copia completa</h3><p>Datos y fotos en un solo archivo. Guárdalo en iCloud o Drive.</p><div class="rvb"><button class="btn" id="bkd">Descargar copia</button><button class="btn" id="bku">Importar copia</button><input type="file" id="bkf" accept="application/json,.json" hidden></div><small style="color:var(--muted)">${S.bk?"Última copia: "+new Date(S.bk).toLocaleDateString("es-ES"):"Aún sin copia"}</small></div>`)}}
$("#v3").addEventListener("click",e=>{if(e.target.id=="bkd")bkDown();if(e.target.id=="bku")$("#bkf").click()});$("#v3").addEventListener("change",e=>{if(e.target.id=="bkf"&&e.target.files[0])bkUp(e.target.files[0])});
setTimeout(gcPh,3000);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
theme();render();
</script>
